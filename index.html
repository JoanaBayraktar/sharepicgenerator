<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sharepic Generator</title>
<link rel="icon" href="assets/logo-fraktion-bayern.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Icon-Sprite (Lucide-Stil, 2px Strich) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15h6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
    <symbol id="i-none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></symbol>
    <symbol id="i-front" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M6.6 6.6A18.4 18.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="m2 2 20 20"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></symbol>
    <symbol id="i-badge" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 13.5 7-3"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M10 7H6a2 2 0 0 0-2 2v3h5v5H4"/><path d="M20 7h-4a2 2 0 0 0-2 2v3h5v5h-5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 20a6.5 6.5 0 0 0-2.5-5.1"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-sign" viewBox="0 0 24 24"><path d="M4 18c3-4 5-4 6-1s3 3 5-1 3-4 5 0"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-step-fwd" viewBox="0 0 24 24"><rect x="3" y="3" width="12" height="12" rx="2" stroke-dasharray="3 2.5"/><rect x="9" y="9" width="12" height="12" rx="2" fill="currentColor" fill-opacity=".22"/></symbol>
    <symbol id="i-step-back" viewBox="0 0 24 24"><rect x="3" y="3" width="12" height="12" rx="2" fill="currentColor" fill-opacity=".22"/><rect x="9" y="9" width="12" height="12" rx="2" stroke-dasharray="3 2.5"/></symbol>
    <symbol id="i-to-front" viewBox="0 0 24 24"><rect x="2" y="2" width="9" height="9" rx="1.5" stroke-dasharray="2.5 2"/><rect x="13" y="13" width="9" height="9" rx="1.5" stroke-dasharray="2.5 2"/><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" fill-opacity=".35"/></symbol>
    <symbol id="i-to-back" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" fill-opacity=".35"/><rect x="2" y="2" width="9" height="9" rx="1.5" fill="#fff"/><rect x="13" y="13" width="9" height="9" rx="1.5" fill="#fff"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="brand">
    <img src="assets/logo-fraktion-bayern.png" alt="" class="brand-logo" width="30" height="30">
    <div class="brand-text"><strong class="brand-name">Sharepic Generator</strong></div>
  </div>
  <nav class="mode-tabs" role="tablist" aria-label="Arbeitsbereich">
    <button role="tab" data-mode="social">Social Media</button>
    <button role="tab" data-mode="poster">Plakat</button>
  </nav>
  <div class="actions">
    <div class="tool-group" role="group" aria-label="Projekt">
      <button id="btnReset" class="icon-btn on-dark" title="Neues Projekt" aria-label="Neues Projekt"><svg class="i"><use href="#i-new"/></svg></button>
      <label class="icon-btn on-dark" title="Projekt öffnen" aria-label="Projekt öffnen"><svg class="i"><use href="#i-open"/></svg><input type="file" id="fileProject" accept=".json,application/json" hidden></label>
      <button id="btnSave" class="icon-btn on-dark" title="Projekt speichern" aria-label="Projekt speichern"><svg class="i"><use href="#i-save"/></svg></button>
    </div>
    <div class="export-group" role="group" aria-label="Export">
      <select id="exportType" class="on-dark" aria-label="Dateiformat">
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
        <option value="pdf">PDF</option>
      </select>
      <button id="btnExportOne" class="btn on-dark"><svg class="i"><use href="#i-download"/></svg><span id="exportOneText">Diese Slide</span></button>
      <button id="btnExportAll" class="btn primary"><svg class="i"><use href="#i-download"/></svg><span id="exportAllText">Alle als ZIP</span></button>
      <button id="btnShare" class="btn on-dark" hidden><svg class="i"><use href="#i-share"/></svg>Teilen</button>
    </div>
  </div>
</header>

<main class="app">
  <!-- Projekt -->
  <aside class="panel" id="projectPanel" aria-label="Projekt-Einstellungen">
    <header class="panel-head project">
      <h1 class="area-title">Projekt</h1>
      <span class="area-scope term-scope-all">Gilt für alle Slides</span>
    </header>
    <details class="sec" data-sec="format" open>
      <summary><h2>Format</h2><svg class="i chev"><use href="#i-chev"/></svg></summary>
      <div class="sec-body">
        <select data-pbind="format" id="formatSelect" aria-label="Format"></select>
        <label class="switch" id="safeField"><input type="checkbox" data-pbind="useSafe"><span>Sicherheitszonen beachten</span></label>
        <label class="switch" id="bleedField"><input type="checkbox" data-pbind="bleed"><span>3 mm Beschnitt für die Druckerei</span></label>
        <p class="meta" id="printInfo"></p>
      </div>
    </details>

    <details class="sec" data-sec="karussell" open>
      <summary><h2 id="karTitle">Karussell</h2><svg class="i chev"><use href="#i-chev"/></svg></summary>
      <div class="sec-body">
        <div class="switch-row" data-mode="social">
          <label class="switch"><input type="checkbox" data-pbind="numbering"><span>Seitenzahl</span></label>
          <label class="switch"><input type="checkbox" data-pbind="swipe"><span>Wisch-Pfeil</span></label>
        </div>
        <div class="field">
          <label>Durchgehender Verlauf</label>
          <div class="flow-picker" id="flowPicker"></div>
          <div class="row">
            <button class="btn ghost small" id="btnFlowShuffle" type="button"><svg class="i"><use href="#i-shuffle"/></svg>Neu mischen</button>
            <button class="btn ghost small" id="btnFlowAll" type="button"><span class="term-all">Auf alle Slides</span></button>
          </div>
        </div>
        <div class="field grid2">
          <div><label>Weichheit</label><input type="range" min="0" max="1" step="0.05" data-pbind="flow.soft" aria-label="Weichheit"></div>
          <div><label>Körnung</label><input type="range" min="0" max="1" step="0.05" data-pbind="flow.grain" aria-label="Körnung"></div>
        </div>
        <div class="field" data-mode="social">
          <label>Panorama-Foto</label>
          <div class="row tight">
            <label class="btn ghost small"><svg class="i"><use href="#i-image"/></svg><span id="panoBtnText">Foto laden</span><input type="file" id="filePano" accept="image/*" hidden></label>
            <button class="link-btn" id="btnPanoRemove">Entfernen</button>
          </div>
        </div>
        <div class="field" id="panoZoomField">
          <label>Panorama-Zoom</label>
          <input type="range" min="1" max="4" step="0.01" data-pbind="panorama.zoom" aria-label="Panorama-Zoom">
        </div>
      </div>
    </details>
    <details class="sec" data-sec="marke" open>
      <summary><h2>Marke</h2><svg class="i chev"><use href="#i-chev"/></svg></summary>
      <div class="sec-body">
        <div class="field">
          <label>Headline-Schrift</label>
          <div class="status-row">
            <span class="status" id="fontStatus"></span>
            <label class="link-btn">Schrift laden<input type="file" id="fileFont" accept=".otf,.ttf,.woff,.woff2" hidden></label>
            <button class="link-btn" id="btnFontReset" hidden>Entfernen</button>
          </div>
        </div>
        <div class="field">
          <label>Logo</label>
          <div class="logo-picker" id="logoPicker">
            <button type="button" data-logo="fraktion">
              <span class="logo-box"><img src="assets/logo-fraktion-bayern.png" alt=""></span>Fraktion
            </button>
            <button type="button" data-logo="custom">
              <span class="logo-box"><span id="logoPreview" class="logo-thumb"></span><svg class="i plus"><use href="#i-upload"/></svg></span>Eigenes
            </button>
            <button type="button" data-logo="none">
              <span class="logo-box"><svg class="i plus"><use href="#i-none"/></svg></span>Keins
            </button>
          </div>
          <label class="switch slide-switch"><input type="checkbox" data-bind="showLogo"><span class="term-this">Auf dieser Slide zeigen</span></label>
          <div class="status-row" id="logoCustomActions">
            <label class="link-btn">Ersetzen<input type="file" id="fileLogo" accept="image/png,image/svg+xml,image/webp" hidden></label>
            <button class="link-btn" id="btnLogoRemove">Entfernen</button>
          </div>
        </div>
        <div class="field pos-size" id="logoPosField">
          <div>
            <label>Position</label>
            <div class="corner-picker seg" data-pbind="logo.pos" title="Oder in der Vorschau frei ziehen">
              <button data-v="tl" aria-label="Oben links"><i></i></button><button data-v="tr" aria-label="Oben rechts"><i></i></button>
              <button data-v="bl" aria-label="Unten links"><i></i></button><button data-v="br" aria-label="Unten rechts"><i></i></button>
            </div>
          </div>
          <div class="grow">
            <label>Größe</label>
            <input type="range" min="0.04" max="0.5" step="0.01" data-pbind="logo.size" aria-label="Logo-Größe">
          </div>
        </div>
        <div class="field">
          <div class="label-row">
            <label for="absender">Absender</label>
            <label class="switch"><input type="checkbox" data-pbind="abs.on" aria-label="Absender anzeigen"></label>
          </div>
          <div id="absFields">
            <input type="text" id="absender" data-pbind="absender" placeholder="Dein Name">
            <label class="switch slide-switch"><input type="checkbox" data-bind="showAbsender"><span class="term-this">Auf dieser Slide zeigen</span></label>
            <div class="seg sub" data-pbind="abs.font" aria-label="Absender-Schrift"><button data-v="gt" class="face-gt">GrueneType Neue</button><button data-v="pt" class="face-pt">PT Sans</button></div>
            <div class="pos-size sub">
              <div>
                <label>Position</label>
                <div class="corner-picker seg" data-pbind="abs.pos" title="Oder in der Vorschau frei ziehen">
                  <button data-v="tl" aria-label="Oben links"><i></i></button><button data-v="tr" aria-label="Oben rechts"><i></i></button>
                  <button data-v="bl" aria-label="Unten links"><i></i></button><button data-v="br" aria-label="Unten rechts"><i></i></button>
                </div>
              </div>
              <div class="grow">
                <label>Größe</label>
                <input type="range" min="0.4" max="3" step="0.05" data-pbind="abs.size" aria-label="Absender-Größe">
              </div>
            </div>
          </div>
        </div>
      </div>
    </details>

    <p class="notice" id="saveHint" hidden></p>
  </aside>
  <div class="resizer" data-side="left" role="separator" aria-orientation="vertical" aria-label="Breite der linken Spalte ändern" tabindex="0" title="Ziehen = Breite ändern · Doppelklick = Standard"></div>

  <!-- Bühne -->
  <section class="stage" aria-label="Vorschau">
    <div class="stage-bar">
      <div class="tool-group" role="group" aria-label="Bearbeitungsverlauf">
        <button class="icon-btn" id="btnUndo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig"><svg class="i"><use href="#i-undo"/></svg></button>
        <button class="icon-btn" id="btnRedo" title="Wiederherstellen (Strg+Y)" aria-label="Wiederherstellen"><svg class="i"><use href="#i-redo"/></svg></button>
      </div>
      <div class="tool-group zoom" role="group" aria-label="Zoom">
        <button class="icon-btn" id="zoomOut" title="Verkleinern (Strg + Mausrad)" aria-label="Verkleinern"><svg class="i"><use href="#i-minus"/></svg></button>
        <button class="zoom-val" id="zoomFit" title="Einpassen" aria-label="Einpassen">Einpassen</button>
        <button class="icon-btn" id="zoomIn" title="Vergrößern (Strg + Mausrad)" aria-label="Vergrößern"><svg class="i"><use href="#i-plus"/></svg></button>
      </div>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="preview" aria-label="Vorschau der aktuellen Slide"></canvas>
    </div>
    <div class="filmstrip">
      <div class="filmstrip-head">
        <span class="count" id="slideCount"></span>
        <div class="tool-group" role="group" aria-label="Slide">
          <button class="icon-btn" id="btnLeft" title="Nach links verschieben" aria-label="Nach links verschieben"><svg class="i"><use href="#i-left"/></svg></button>
          <button class="icon-btn" id="btnRight" title="Nach rechts verschieben" aria-label="Nach rechts verschieben"><svg class="i"><use href="#i-right"/></svg></button>
          <button class="icon-btn" id="btnDup" title="Duplizieren" aria-label="Duplizieren"><svg class="i"><use href="#i-copy"/></svg></button>
          <button class="icon-btn danger" id="btnDel" title="Löschen" aria-label="Löschen"><svg class="i"><use href="#i-trash"/></svg></button>
        </div>
      </div>
      <div class="strip-bar">
        <div class="strip" id="strip"></div>
        <div class="add-slides">
          <button id="btnAdd" class="add-slide" title="Slide hinzufügen" aria-label="Slide hinzufügen"><svg class="i"><use href="#i-plus"/></svg><span>Text</span></button>
          <label class="add-slide" title="Bild-Slide hinzufügen" aria-label="Bild-Slide hinzufügen"><svg class="i"><use href="#i-image"/></svg><span>Bild</span><input type="file" id="addImageSlide" accept="image/*" hidden></label>
        </div>
      </div>
    </div>
  </section>

  <div class="resizer" data-side="right" role="separator" aria-orientation="vertical" aria-label="Breite der rechten Spalte ändern" tabindex="0" title="Ziehen = Breite ändern · Doppelklick = Standard"></div>
  <!-- Slide-Editor -->
  <aside class="panel" id="editor" aria-label="Slide bearbeiten">
    <header class="panel-head edit">
      <h1 class="area-title"><span class="term-one">Slide</span> <span id="slideNo"></span></h1>
      <span class="area-scope term-scope-one">Nur diese Slide</span>
    </header>
    <section class="sec head">
      <div class="label-row"><label>Vorlage</label><button class="icon-btn reset-slide" id="btnResetSlide" type="button" title="Auf Designvorschlag der Vorlage zurücksetzen" aria-label="Auf Designvorschlag der Vorlage zurücksetzen"><svg class="i"><use href="#i-reset"/></svg></button></div>
      <div class="seg grid3" data-bind="layout" aria-label="Vorlage">
        <button data-v="balken">Titel</button>
        <button data-v="text">Text</button>
        <button data-v="liste">Liste</button>
        <button data-v="zahl">Zahl</button>
        <button data-v="zitat">Zitat</button>
        <button data-v="event">Termin</button>
        <button data-v="bild">Bild</button>
      </div>
    </section>

    <section class="sec layers-sec">
      <div class="layers-head"><h2>Elemente</h2><span class="meta" id="layerCount"></span></div>
      <div class="layers" id="layers" role="list"></div>
      <button class="add-btn" id="addMenuBtn" type="button" aria-haspopup="menu"><svg class="i"><use href="#i-plus"/></svg>Element hinzufügen</button>
      <input type="file" id="addImage" accept="image/*" hidden>
      <div class="url-row" id="urlRow" hidden>
        <input type="text" id="imgUrl" placeholder="https://…/bild.jpg" inputmode="url" aria-label="Bild-Link">
        <button class="btn small" id="imgUrlLoad" type="button">Laden</button>
        <button class="icon-btn" id="imgUrlClose" type="button" title="Schließen" aria-label="Schließen"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div class="emoji-picker" id="emojiPicker" hidden>
        <div class="emoji-grid" id="emojiGrid"></div>
        <div class="row emoji-own">
          <input type="text" id="emojiInput" placeholder="Eigenes Emoji" maxlength="16" aria-label="Eigenes Emoji">
          <button class="btn ghost small" id="btnEmojiAdd"><svg class="i"><use href="#i-plus"/></svg>Einfügen</button>
        </div>
      </div>
    </section>
    <details class="sec" data-sec="gestaltung" open>
      <summary><h2>Gestaltung</h2><svg class="i chev"><use href="#i-chev"/></svg></summary>
      <div class="sec-body">
        <div class="field">
          <label><span>Schrift</span><button type="button" class="prop-reset" data-reset="font" data-tip="Auf Standard zurücksetzen" aria-label="Auf Standard zurücksetzen" hidden><svg class="i"><use href="#i-reset"/></svg></button></label>
          <div class="seg" data-bind="font"><button data-v="gt" class="face-gt">GrueneType Neue</button><button data-v="pt" class="face-pt">PT Sans</button></div>
        </div>
        <div class="field">
          <label><span>Balkenfarbe</span><button type="button" class="prop-reset" data-reset="scheme" data-tip="Auf Standard zurücksetzen" aria-label="Auf Standard zurücksetzen" hidden><svg class="i"><use href="#i-reset"/></svg></button></label>
          <div class="swatches" data-bind="scheme" data-type="scheme"></div>
          <div class="color-editor" id="schemeEditor" hidden>
            <label><input type="color" id="ceBar" value="#005538">Balken</label>
            <label><input type="color" id="ceText" value="#fff17a">Schrift</label>
            <button class="btn small" id="ceAdd" type="button">Hinzufügen</button>
            <button class="link-btn" id="ceCancel" type="button">Abbrechen</button>
          </div>
          <button class="link-btn mini" id="schemeRemove" type="button" hidden>Kombination entfernen</button>
        </div>
        <div class="field grid2">
          <div><label><span>Textgröße</span><span class="lab-end"><button type="button" class="prop-reset" data-reset="size" data-tip="Auf Standard zurücksetzen" aria-label="Auf Standard zurücksetzen" hidden><svg class="i"><use href="#i-reset"/></svg></button><span class="val" data-val="size"></span></span></label><input type="range" min="0.5" max="1.6" step="0.05" data-bind="size" aria-label="Textgröße"></div>
          <div><label><span>Neigung</span><span class="lab-end"><button type="button" class="prop-reset" data-reset="angle" data-tip="Auf Standard zurücksetzen" aria-label="Auf Standard zurücksetzen" hidden><svg class="i"><use href="#i-reset"/></svg></button><span class="val" data-val="angle"></span></span></label><input type="range" min="-8" max="8" step="1" data-bind="angle" aria-label="Neigung"></div>
        </div>
        <div class="field grid2">
          <div><label><span>Position</span><button type="button" class="prop-reset" data-reset="posY" data-tip="Auf Standard zurücksetzen" aria-label="Auf Standard zurücksetzen" hidden><svg class="i"><use href="#i-reset"/></svg></button></label><div class="seg" data-bind="posY"><button data-v="top">Oben</button><button data-v="middle">Mitte</button><button data-v="bottom">Unten</button></div></div>
          <div><label><span>Ausrichtung</span><button type="button" class="prop-reset" data-reset="align" data-tip="Auf Standard zurücksetzen" aria-label="Auf Standard zurücksetzen" hidden><svg class="i"><use href="#i-reset"/></svg></button></label><div class="seg" data-bind="align"><button data-v="left">Links</button><button data-v="center">Mitte</button></div></div>
        </div>
        <div class="field">
          <label><span>Schlagschatten (alle Elemente)</span><span class="lab-end"><button type="button" class="prop-reset" data-reset="shadow" data-tip="Auf Standard zurücksetzen" aria-label="Auf Standard zurücksetzen" hidden><svg class="i"><use href="#i-reset"/></svg></button><span class="val" data-val="shadow"></span></span></label>
          <input type="range" min="0" max="1" step="0.05" data-bind="shadow" aria-label="Schlagschatten">
        </div>
      </div>
    </details>

    <details class="sec" data-sec="hintergrund" open>
      <summary><h2>Hintergrund</h2><svg class="i chev"><use href="#i-chev"/></svg></summary>
      <div class="sec-body">
        <div class="seg" data-bind="bg.type" aria-label="Hintergrund"><button data-v="flow">Verlauf</button><button data-v="color">Farbe</button><button data-v="image">Foto</button><button data-v="panorama">Panorama</button></div>
        <div data-bg="color">
          <div class="field">
            <div class="swatches" data-bind="bg.color" data-type="color"></div>
            <button class="link-btn mini" id="colorRemove" type="button" hidden>Farbe entfernen</button>
          </div>
          <label class="switch field"><input type="checkbox" id="gradToggle"><span>Farbverlauf</span></label>
          <div id="gradField">
            <div class="field">
              <label>Zweite Farbe</label>
              <div class="swatches" data-bind="bg.color2" data-type="color"></div>
            </div>
            <div class="field">
              <label>Richtung</label>
              <div class="seg" data-bind="bg.dir"><button data-v="down">Nach unten</button><button data-v="diag">Diagonal</button><button data-v="right">Nach rechts</button></div>
            </div>
          </div>
        </div>
        <div class="field" data-bg="image">
          <label class="btn ghost small"><svg class="i"><use href="#i-image"/></svg>Foto wählen<input type="file" id="fileBg" accept="image/*" hidden></label>
        </div>
        <div class="field" data-bg="image">
          <label>Zoom</label>
          <input type="range" min="1" max="4" step="0.01" data-bind="bg.zoom" aria-label="Zoom">
        </div>
        <p class="notice" id="panoHint">Noch kein Panorama-Foto geladen.</p>
        <div data-bg="image panorama">
          <div class="field">
            <label>Abdunkeln <span class="val" data-val="bg.overlay"></span></label>
            <input type="range" min="0" max="0.9" step="0.05" data-bind="bg.overlay" aria-label="Abdunkeln">
          </div>
          <div class="field">
            <label>Verlauf</label>
            <div class="seg" data-bind="bg.ovMode"><button data-v="auto">Auto</button><button data-v="bottom">Unten</button><button data-v="top">Oben</button><button data-v="full">Fläche</button></div>
          </div>
          <div class="field">
            <label>Verlaufsfarbe</label>
            <div class="swatches small" data-bind="bg.ovColor" data-type="overlay"></div>
          </div>
        </div>
      </div>
    </details>






  </aside>
</main>
<input type="color" id="colorPick" class="visually-hidden" tabindex="-1" aria-hidden="true">

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
